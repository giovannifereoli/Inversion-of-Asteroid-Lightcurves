[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lcinv"
version = "0.1.0"
description = "Asteroid lightcurve inversion after Kaasalainen & Torppa (2001)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Giovanni Fereoli" }]
keywords = ["asteroids", "photometry", "lightcurve", "inversion", "shape modelling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
bayes = ["emcee>=3.1", "corner>=2.2", "tqdm>=4.65"]
notebook = ["jupyter", "matplotlib>=3.7"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "matplotlib>=3.7",
    "emcee>=3.1",
    "corner>=2.2",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-section-index>=0.3",
]

[project.urls]
Homepage = "https://github.com/gife3672/Inversion-of-Asteroid-Lightcurves"
DAMIT = "https://damit.cuni.cz"

[project.scripts]
lcinv = "lcinv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running numerical tests",
    "network: requires access to DAMIT",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
ignore = ["E741"]  # `l` is the paper's own symbol for plane distances

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.coverage.run]
source = ["lcinv"]
omit = ["*/plotting.py", "*/cli.py"]
