[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lcinv"
version = "0.1.0"
description = "Asteroid lightcurve inversion after Kaasalainen & Torppa (2001), Icarus 153, 24-36"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Giovanni Fereoli" }]
keywords = ["asteroids", "photometry", "lightcurve", "inverse problems", "shape modelling"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
data = ["requests>=2.28"]
horizons = ["astroquery>=0.4.6", "astropy>=5.0"]
test = ["pytest>=7.0", "pytest-cov"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.0"]
all = [
    "matplotlib>=3.6", "requests>=2.28", "pytest>=7.0", "pytest-cov",
    "astroquery>=0.4.6", "astropy>=5.0", "mkdocs>=1.5", "mkdocs-material>=9.0",
]

[project.scripts]
lcinv = "lcinv.cli:main"

[project.urls]
Homepage = "https://github.com/gife3672/Inversion-of-Asteroid-Lightcurves"
Paper = "https://doi.org/10.1006/icar.2001.6673"
DAMIT = "https://damit.cuni.cz/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running tests (full inversions, ray tracing sweeps)",
    "network: tests that hit the network (DAMIT / ALCDEF)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
